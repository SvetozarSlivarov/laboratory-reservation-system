spring:
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        name: laboratory-reservation
        version: "1.0.0"
        type: SYNC
        protocol: STATELESS
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        capabilities:
          resource: false
          prompt: false
          completion: false
  mvc:
    problemdetails:
      enabled: true
  application:
    name: laboratory-reservation-system
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: lax
app:
  mcp:
    allowed-origin: ${MCP_ALLOWED_ORIGIN:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    timeout: 3s
  google:
    enabled: ${GOOGLE_LOGIN_ENABLED:false}
